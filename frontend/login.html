<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | AutoTrack Showroom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #2c2c2c, #800000);
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .login-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }

    .login-card {
      background-color: #1e1e1e;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
      max-width: 480px;
      width: 100%;
      color: #fff;
    }

  .form-header {
  text-align: center;
  color: #ffdddd;
  margin-bottom: 30px;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 2px solid #800000; /* Mehroon line */
  padding-bottom: 10px;
  letter-spacing: 1px;
  text-shadow: 0 0 2px rgba(255, 255, 255, 0.1);
}


    .form-group label {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 6px;
    }

    .form-group {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      background-color: #333;
      color: #fff;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 10px #ffcccc;
      background-color: #444;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: #bbb;
      cursor: pointer;
    }

    button {
      background: #ff4d4d;
      border: none;
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      width: 100%;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ff1a1a;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.8);
    }

    a {
      color: #ff9999;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .form-toggle {
      text-align: center;
      margin-top: 15px;
    }

    #register-form {
      display: none;
      transition: opacity 0.3s ease;
    }

    .footer {
      background-color: #111;
      color: #ccc;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section class="login-section">
    <div class="login-card">

      <!-- Login Form -->
      <form id="login-form">
        <h2 class="form-header">Login to Your Account</h2>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
          <i class="fas fa-eye toggle-password" toggle="#password"></i>
        </div>
        <button type="submit">Login</button>

        <p class="form-toggle">
          Don’t have an account? <a href="#" id="show-register-form">Register here</a>
        </p>
      </form>

      <!-- Register Form -->
      <form id="register-form">
        <h3 class="form-header">Create New Account</h3>

        <div class="form-group">
          <label for="reg-fname">First Name:</label>
          <input type="text" id="reg-fname" name="fname" placeholder="Enter your first name" required />
        </div>
        <div class="form-group">
          <label for="reg-lname">Last Name:</label>
          <input type="text" id="reg-lname" name="lname" placeholder="Enter your last name" required />
        </div>
        <div class="form-group">
          <label for="reg-username">Username:</label>
          <input type="text" id="reg-username" name="username" placeholder="Choose a username" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password:</label>
          <input type="password" id="reg-password" name="password" placeholder="Create a password" required />
          <i class="fas fa-eye toggle-password" toggle="#reg-password"></i>
        </div>
        <div class="form-group">
          <label for="reg-email">Email:</label>
          <input type="email" id="reg-email" name="email" placeholder="Enter your email" required />
        </div>

        <button type="submit">Register</button>

        <p class="form-toggle">
          Already have an account? <a href="#" id="show-login-form">Login here</a>
        </p>
      </form>

    </div>
  </section>

  <footer class="footer">
    &copy; 2025 AUTOTrack Showroom. All rights reserved.
  </footer>

  <script>
    // Show/Hide Register/Login Forms
    document.getElementById("show-register-form").addEventListener("click", function (e) {
      e.preventDefault();
      document.getElementById("login-form").style.display = "none";
      document.getElementById("register-form").style.display = "block";
    });

    document.getElementById("show-login-form").addEventListener("click", function (e) {
      e.preventDefault();
      document.getElementById("register-form").style.display = "none";
      document.getElementById("login-form").style.display = "block";
    });

    // Toggle Password Eye Icon
    document.querySelectorAll(".toggle-password").forEach((icon) => {
      icon.addEventListener("click", function () {
        const input = document.querySelector(this.getAttribute("toggle"));
        if (input.type === "password") {
          input.type = "text";
          this.classList.remove("fa-eye");
          this.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          this.classList.remove("fa-eye-slash");
          this.classList.add("fa-eye");
        }
      });
    });

    // LOGIN Request
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          localStorage.setItem('token', data.token);

          if (data.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else if (data.role === 'staff') {
            window.location.href = 'staff-dashboard.html';
          } else if (data.role === 'customer') {
            window.location.href = 'customer-dashboard.html';
          } else {
            alert('User role not recognized.');
          }
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Server error. Please try again later.');
      }
    });

    // REGISTER Request
    document.getElementById("register-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const fname = document.getElementById("reg-fname").value.trim();
      const lname = document.getElementById("reg-lname").value.trim();
      const username = document.getElementById("reg-username").value.trim();
      const password = document.getElementById("reg-password").value;
      const email = document.getElementById("reg-email").value.trim();

      try {
        const res = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fname, lname, username, password, email })
        });

        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          document.getElementById("register-form").style.display = "none";
          document.getElementById("login-form").style.display = "block";
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Server error. Please try again later.');
      }
    });
  </script>
</body>
</html>
