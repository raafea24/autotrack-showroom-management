<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | AutoTrack Showroom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #141414, #800000, #141414);
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
    }

    .contact-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .contact-card {
      background: rgba(24, 24, 24, 0.95);
      border-radius: 16px;
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.2);
      padding: 45px;
      width: 100%;
      max-width: 650px;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .contact-header {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 30px;
      border-bottom: 1px solid #ff4d4d;
      padding-bottom: 10px;
    }

    .form-floating label {
      color: #ccc;
      font-size: 15px;
    }

    .form-control {
      background-color: #2c2c2c;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }

    .form-control:focus {
      background-color: #333;
      border-color: #ff4d4d;
      box-shadow: 0 0 6px rgba(255, 77, 77, 0.4);
      color: #fff;
    }

    button {
      background: #cc0000;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
      color: #fff;
      margin-top: 20px;
      transition: 0.3s ease-in-out;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
    }

    button:hover {
      background: #990000;
      box-shadow: 0 0 14px rgba(255, 77, 77, 0.6);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-weight: 500;
      color: #ff9999;
      font-size: 15px;
      text-decoration: none;
      transition: 0.3s ease-in-out;
    }

    .back-home:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .map-section {
      width: 100%;
      max-width: 1100px;
      margin: 40px auto;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.2);
    }

    .map-section iframe {
      width: 100%;
      height: 350px;
      border: none;
    }

    .social-icons {
      text-align: center;
      margin: 30px 0;
    }

    .social-icons a {
      color: #ff9999;
      margin: 0 12px;
      font-size: 24px;
      transition: 0.3s;
    }

    .social-icons a:hover {
      color: #ffffff;
    }

    .footer {
      background-color: #101010;
      color: #bbb;
      text-align: center;
      padding: 15px 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Contact Form Section -->
  <section class="contact-section">
    <div class="contact-card">
      <h2 class="contact-header">Contact AutoTrack</h2>
      <form id="contact-form">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="from_name" name="from_name" placeholder="Your Name" required>
          <label for="from_name">Your Name</label>
        </div>

        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="from_email" name="from_email" placeholder="name@domain.com" required>
          <label for="from_email">Your Email</label>
        </div>

        <div class="form-floating mb-3">
          <textarea class="form-control" id="message" name="message" style="height: 120px;" placeholder="Write your message..." required></textarea>
          <label for="message">Your Message</label>
        </div>

        <button type="submit">Send Message</button>
      </form>

      <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </section>

  <!-- Map Section -->
 <!-- Map Section -->
<section class="map-section">
  <div class="container text-center">
    <h3 style="margin-bottom: 25px; color: #ffcccc;">Our Location</h3>
    <div class="map-container" style="
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.25);
      max-width: 100%;
      height: 350px;
      margin: 0 auto;
    ">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3313.2397632989233!2d73.0551!3d33.6844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38df956504c1a877%3A0x4a5f9e8d308c3504!2sCOMSATS%20University%20Islamabad!5e0!3m2!1sen!2s!4v1719155159167!5m2!1sen!2s"
        width="100%"
        height="100%"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>
</section>


  <!-- Social Icons -->
  <div class="social-icons">
    <a href="#" title="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
    <a href="#" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
  </div>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 AutoTrack Showroom. All rights reserved.
  </footer>

  <script>
    // Configure these public EmailJS identifiers for your own account.
    const EMAILJS_PUBLIC_KEY = "YOUR_EMAILJS_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";

    // Initialize EmailJS
    (function () {
      if (!EMAILJS_PUBLIC_KEY.startsWith("YOUR_")) {
        emailjs.init(EMAILJS_PUBLIC_KEY);
      }
    })();

    // Handle form submission
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();

      if ([EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID].some(value => value.startsWith("YOUR_"))) {
        alert("Contact form is not configured. Add your EmailJS identifiers in contact.html.");
        return;
      }

      emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, this)
        .then(function () {
          alert("✅ Message sent successfully! We'll contact you soon.");
          document.getElementById("contact-form").reset();
        }, function (error) {
          alert("❌ Failed to send message. Try again later.");
          console.error("EmailJS Error:", error);
        });
    });
  </script>

</body>
</html>
